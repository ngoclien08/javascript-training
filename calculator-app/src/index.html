<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calculator</title>
  <link rel="stylesheet" href="./styles/main.css" />
</head>
<body>
  <main class="container">
    <div class="calculator">
      <div class="display">
        <div class="history" id="history">0</div>
        <div class="result" id="result">0</div>
      </div>
      <div class="buttons">
        <button class="btn btn-special" data-value="C" name="clear">C</button>
        <button class="btn operator btn-special" data-value="÷" name="divide">÷</button>
        <button class="btn operator btn-special" data-value="×" name="multiply">×</button>
        <button class="btn btn-backspace" data-value="⌫" name="backspace">⌫</button>

        <button class="btn" data-value="7" name="seven">7</button>
        <button class="btn" data-value="8" name="eight">8</button>
        <button class="btn" data-value="9" name="nine">9</button>
        <button class="btn operator btn-special" data-value="−" name="subtract">−</button>

        <button class="btn" data-value="4" name="four">4</button>
        <button class="btn" data-value="5" name="five">5</button>
        <button class="btn" data-value="6" name="six">6</button>
        <button class="btn operator btn-special" data-value="+" name="add">+</button>

        <button class="btn" data-value="1" name="one">1</button>
        <button class="btn" data-value="2" name="two">2</button>
        <button class="btn" data-value="3" name="three">3</button>
        <button class="btn equals" data-value="=" name="equals">=</button>

        <button class="btn" data-value="%" name="percent">%</button>
        <button class="btn" data-value="0" name="zero">0</button>
        <button class="btn btn-special" data-value="." name="decimal">.</button>
      </div>
    </div>
    <script src="./scripts/app.js"></script>
  </main>
</body>
</html>
