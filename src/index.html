<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thao tác DOM: Bảng & Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Quản lý người dùng</h1>
        
        <!-- Form để nhập dữ liệu -->
        <form id="userForm">
            <input type="text" id="name" placeholder="Tên" required>
            <input type="number" id="age" placeholder="Tuổi" required>
            <input type="email" id="email" placeholder="Email" required>
            <button type="submit" id="submitBtn">Thêm người dùng</button>
            <button type="button" id="updateBtn" style="display: none;">Cập nhật</button>
        </form>

        <!-- Bảng để hiển thị dữ liệu -->
        <table id="userTable">
            <thead>
                <tr>
                    <th>Tên</th>
                    <th>Tuổi</th>
                    <th>Email</th>
                    <th>Hành động</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
    <script src="script.js"></script>
</body>
</html>
